# Basketball360 -- local (Mac / single GPU) config for indoor basketball.
# Inherits everything from pipeline.yaml and overrides only what differs.
#
# Geometry assumption (calibrate on your footage!):
#   Insta360 X5 at the half-court line on the sideline, ~1.5-2.5 m high,
#   lens facing the court centre = yaw 0 in the exported equirect MP4.
#   Court 28 x 15 m -> baselines at roughly yaw +/-80 deg, near-side players
#   down to pitch ~-60 deg, hoops (3.05 m) slightly above the horizon.
extends: pipeline.yaml

paths:
  ingest: ./data/ingest
  scratch: ./data/scratch
  processed: ./data/processed
  highlights: ./data/highlights
  models: ./data/models
  labeling: ./data/labeling
  stagging: ./data/stagging
  archive_raw: ./data/archive_raw
  logs: ./data/logs

model:
  path: ./data/models/yolo26m.pt
  base_model: ./data/models/yolo26m.pt
  backend: fp32

detector:
  runtime_override_path: ./data/state/ingest_model_selection.json
  player_runtime_override_path: ./data/state/ingest_player_model_selection.json
  ball_model_config_override_path: ./data/state/ball_model_config.json
  player_model_path: ./data/models/yolo26m.pt
  batch_size: 4

detection:
  path: ./data/models/yolo26m.pt
  device: auto            # cuda:0 -> mps (Apple Silicon) -> cpu
  half: false
  img_size: 1920          # 3840 in upstream; halve for laptop speed
  conf: 0.15
  max_det: 60

field_of_interest:
  enabled: true
  center_mode: fixed
  center_yaw_deg: 0
  yaw_window_deg: 200     # whole court incl. baselines/hoops from the sideline
  pitch_min_deg: -60      # near-side players are well below the horizon
  pitch_max_deg: 25

filters:
  min_y_frac: 0.30        # ~ pitch +36 deg
  max_y_frac: 0.88        # ~ pitch -68 deg
  max_jump_px: 300
  max_speed_px_per_s: 3500   # passes / long rebounds are fast at this distance

tracker:
  max_speed_px_per_frame: 260
  max_displacement_px: 380
  max_bbox_area: 20000    # ball is much bigger when it passes near the camera

camera:
  max_pan_speed_deg_per_sec: 90.0
  max_fast_pan_speed_deg_per_sec: 180.0   # fast breaks cross the court in ~3 s
  default_fov: 100.0
  min_fov: 72.0          # tightest framing, only near the baskets (see fov_hoop_zoom)
  max_fov: 120.0
  field_center_pitch_deg: -15.0
  deadband_deg: 3.0
  lookahead_frames: 5
  lookahead_max_deg: 15.0
  # cinematic smoothing: faster ease-in for fast breaks (pipeline.yaml: 45 / 0.6)
  max_pan_accel_deg_per_sec2: 90.0
  pan_response_sec: 0.45
  pan_lead_sec: 0.7       # anticipate: start moving before players reach the other half
  fov_max_rate_deg_per_sec: 8.0   # half-court switch zooms out/in within ~3-5 s
  fov_max_accel_deg_per_sec2: 8.0
  fov_hoop_zoom:          # no zoom mid-court, moderate zoom under the baskets
    enabled: true
    near_deg: 15.0
    far_deg: 35.0
    mid_min_fov: 100.0
  # COCO "sports ball" mostly fires on a parked spare ball -> drop static spots.
  static_ball_filter:
    enabled: true
  # Frame the active half; wander inside it is followed only 30%, so the
  # camera pans once per change of possession instead of swinging.
  half_court:
    enabled: true
    switch_deg: 8.0
    min_dwell_sec: 2.0
    anchor_frac: 0.5
    follow: 0.3
  # Court corners clicked on /calibrate: only players on the court steer the
  # camera (bench/table ignored) and the zoom widens to keep all of them in.
  court_fit:
    enabled: true
    max_fov: 115.0
  # Hold still, then move decisively: no small corrective drifts.
  pan_hold_trigger_deg: 12.0
  pitch_hold_trigger_deg: 10.0
  pan_settle_speed_deg_per_sec: 4.0
  pan_settle_sec: 0.5
  # Elevated camera (1st-floor balcony): when zoomed on a basket, raise the
  # frame so the backboard stays in view. yaw/pitch = top edge of each
  # backboard, measured on the 8K equirect frame. Re-measure if the camera
  # position or heading changes.
  keep_in_frame:
    - {yaw: -51.2, pitch: -3.9, margin_deg: 3.0}   # left basket
    - {yaw: 62.6, pitch: -2.7, margin_deg: 3.0}    # right basket

center_of_play:
  # Ball is in someone's hands most of the time -> lean on the player cluster.
  min_player_conf: 0.50
  trim_fraction: 0.15
  min_players: 4
  ball_blend_weight: 0.35
  low_conf_ball_blend_weight: 0.60
  fast_ball_weight: 0.75
  slow_ball_weight: 0.35
  spread_max_fov: 120.0

reframer:
  output_resolution: [1920, 1080]
  source_downscale: [5760, 2880]   # 8K source; sharper when zoomed to ~62 deg
  # Live scoreboard picture-in-picture, cut from the 360 frame each frame.
  # yaw/pitch = scoreboard centre measured on the 8K frame (camera-specific).
  # Elevated camera looks down ~25-35 deg: straighten verticals (75%) and
  # level the horizon (roll/tilt measured per video by calibration).
  vertical_correction: 0.75
  level:
    enabled: true
  scoreboard_overlay:
    enabled: true
    yaw: 8.2
    pitch: 3.3
    fov_h: 6.8            # deg of the 360 frame to cut
    aspect: 1.9           # width / height of the cut
    width_px: 380         # size on the 1920x1080 output
    position: top-left    # top-left | top-right | bottom-left | bottom-right
    margin_px: 24
    border_px: 3
    opacity: 1.0
  num_workers: 6
  tactical_fov: 150
  tactical_pitch: -15.0

highlights:
  enabled: false   # not needed for now; heuristics are not tuned for basketball yet
  # "goal boxes" = areas around the two hoops (normalised x0,y0,x1,y1 in equirect)
  goal_box_regions:
    - [0.22, 0.30, 0.32, 0.55]
    - [0.68, 0.30, 0.78, 0.55]
  pre_margin_sec: 6.0
  post_margin_sec: 3.0
  max_clips: 30

exporter:
  codec: libx264
  encoder: cpu
  crf: 20
  preset: veryfast

ingest:
  archive_on_success: false   # never move the source recording
  archive_mode: leave
  archive_dir: ./data/archive_raw

active_learning:
  export_dir: ./data/labeling

calibration:
  enabled: true
  dir: ./data/state/calibrations
  llm:
    enabled: true                   # needs OPENAI_API_KEY; falls back to local auto without it

# Scores from the scoreboard -> scoring.json / scoring.csv / youtube.txt.
# Team names: dashboard calibration page ("Match"), or `score --home/--guest`.
# Finds board changes locally (keyframe crops of the calibrated scoreboard),
# then reads each constant board state with the vision LLM (calibration.llm
# model/key); ~10 requests for a full game.
scoring:
  enabled: true
  led: red                # red LED digits; "bright" for other colours
  change_threshold: 20    # pixel step that counts as a board change (lower = more candidates)
  tiles_per_request: 20   # board states per LLM request
  tile_scale: 3.0         # upscale of each crop sent to the LLM
  lead_sec: 6.0           # timestamps = board update minus this (shows the play)
  max_points: 3           # bigger jumps are flagged "check"
  chapters: true          # period chapters at the top of youtube.txt
  shooters:               # stage 2: shot moment, shooter, team shirt colours
    enabled: true
    window_sec: 15        # video before each board update searched for the shot
    shot_lead_sec: 3      # timestamp = shot minus this
  numbers:                # stage 3: shooter's jersey number (needs shooters)
    enabled: true

dashboard:
  db_path: ./data/state/dashboard.db

logging:
  file: ./data/logs/basketball360.log
